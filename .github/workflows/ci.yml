name: P0 green build

on:
  pull_request:
  push:
    branches: [main, build/p0-p2-green-foundation, "codex/**", "fable/**"]

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run verify
      - run: npm run test:smoke
      - name: Persist verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-verification
          path: |
            receipts/playwright-report.json
            test-results
